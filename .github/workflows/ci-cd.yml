name: Calculator CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build Docker image and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-calculator:${{ github.sha }} .

      - name: Run tests inside Docker
        run: docker run --rm devops-calculator:${{ github.sha }}

  deploy-to-aws:
    name: Deploy to AWS
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: calculator-aws-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate SAM template
        run: sam validate --template-file template.yaml --region "${{ vars.AWS_REGION }}"

      - name: Build SAM application
        run: sam build --template-file template.yaml

      - name: Deploy CloudFormation stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name devops-calculator-dev \
            --s3-bucket devops-calculator-deploy-851914961775-ap-south-1 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region "${{ vars.AWS_REGION }}"